{% extends "base.html" %}
{% block title %}Peta Distribusi — {{ block.super }}{% endblock %}
{% block content %}

<h1 class="text-2xl font-bold mb-4">Peta Distribusi Reseller</h1>

<div id="map" class="w-full rounded-lg shadow-lg border bg-white" style="height: 600px;"></div>

<!-- Heatmap Plugin -->
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>

<script>
    const mapData = {{ map_data_json|safe }};
    
    // Initial center (Pacitan)
    const map = L.map('map').setView([-8.2, 111.11], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    const tierColors = {
        'gold': '#EAB308',   // yellow-500
        'silver': '#94A3B8', // slate-400
        'bronze': '#D97706'  // amber-600
    };

    const markers = [];
    const heatPoints = [];

    mapData.forEach(reseller => {
        const color = tierColors[reseller.tier] || '#3B82F6';
        
        // Custom circle marker
        const marker = L.circleMarker([reseller.lat, reseller.lng], {
            radius: 8,
            fillColor: color,
            color: '#fff',
            weight: 2,
            opacity: 1,
            fillOpacity: 0.8
        }).addTo(map);

        const popupContent = `
            <div class="p-1">
                <h3 class="font-bold text-lg">${reseller.name}</h3>
                <p class="text-xs text-gray-500 uppercase font-bold">${reseller.tier.toUpperCase()} TIER</p>
                <div class="mt-2 text-sm">
                    <p>Total: <strong>${reseller.total_qty} bks</strong></p>
                    <p>Terakhir: ${reseller.last_tx_date}</p>
                </div>
                <a href="/reseller/${reseller.id}/" class="block mt-3 text-center bg-blue-600 text-white text-xs py-1.5 rounded hover:bg-blue-700">Lihat Detail</a>
            </div>
        `;
        
        marker.bindPopup(popupContent);
        markers.push(marker);

        // Heatmap points (weighted by total quantity)
        // Intensity is normalized (simple division for demo)
        const intensity = Math.min(reseller.total_qty / 1000, 1.0);
        heatPoints.push([reseller.lat, reseller.lng, intensity]);
    });

    // Add Heatmap Layer
    const heat = L.heatLayer(heatPoints, {
        radius: 35,
        blur: 20,
        maxZoom: 17,
        gradient: {0.4: 'blue', 0.65: 'lime', 1: 'red'}
    }).addTo(map);

    // Fit map to markers if any
    if (markers.length > 0) {
        const group = new L.featureGroup(markers);
        map.fitBounds(group.getBounds().pad(0.1));
    }
</script>

<div class="mt-6 bg-white p-4 rounded shadow grid grid-cols-1 sm:grid-cols-3 gap-4 text-center text-sm">
    <div class="flex items-center justify-center space-x-2">
        <span class="w-3 h-3 rounded-full bg-yellow-500"></span>
        <span class="font-bold">Gold (>3000 bks)</span>
    </div>
    <div class="flex items-center justify-center space-x-2">
        <span class="w-3 h-3 rounded-full bg-slate-400"></span>
        <span class="font-bold">Silver (1000-3000)</span>
    </div>
    <div class="flex items-center justify-center space-x-2">
        <span class="w-3 h-3 rounded-full bg-amber-600"></span>
        <span class="font-bold">Bronze (<1000 bks)</span>
    </div>
</div>

{% endblock %}
