<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Distribusi Roko Pacitan{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <nav class="bg-blue-700 text-white shadow">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between relative">
            <a href="/" class="text-lg font-bold">🚬 Distribusi Roko</a>
            
            <input type="checkbox" id="nav-toggle" class="hidden peer">
            <label for="nav-toggle" class="md:hidden cursor-pointer p-2">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>
                </svg>
            </label>

            <div class="hidden peer-checked:block md:block absolute md:relative top-full left-0 w-full md:w-auto bg-blue-700 md:bg-transparent z-50 p-4 md:p-0">
                <div class="flex flex-col md:flex-row space-y-2 md:space-y-0 md:space-x-4 text-sm">
                    <a href="/" class="hover:underline">Dashboard</a>
                    <a href="/stock/" class="hover:underline">Stok</a>
                    <a href="/resellers/" class="hover:underline">Reseller</a>
                    <a href="/map/" class="hover:underline">Peta</a>
                    <a href="/inventory/" class="hover:underline font-bold">Inventory</a>
                </div>
            </div>
        </div>
    </nav>
    <main class="max-w-6xl mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
