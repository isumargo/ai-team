<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Distribusi Roko Pacitan{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <nav class="bg-blue-700 text-white shadow">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="/" class="text-lg font-bold">🚬 Distribusi Roko</a>
            <div class="space-x-4 text-sm">
                <a href="/" class="hover:underline">Dashboard</a>
                <a href="/stock/" class="hover:underline">Stok</a>
                <a href="/resellers/" class="hover:underline">Reseller</a>
                <a href="/inventory/" class="hover:underline font-bold">Inventory</a>
            </div>
        </div>
    </nav>
    <main class="max-w-6xl mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
